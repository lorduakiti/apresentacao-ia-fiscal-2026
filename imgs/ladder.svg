<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- círculos concêntricos: do núcleo (Chat simples) ao anel externo (Agêntico).
       cada nível mais externo engloba o anterior. desenhados de fora p/ dentro,
       com alfa crescente, para dar profundidade ao centro. -->
  <g stroke="#5ab0e6" stroke-width="1.5">
    <circle cx="150" cy="150" r="138" fill="rgba(90,176,230,.05)"/>
    <circle cx="150" cy="150" r="106" fill="rgba(90,176,230,.07)"/>
    <circle cx="150" cy="150" r="74"  fill="rgba(90,176,230,.10)"/>
    <circle cx="150" cy="150" r="42"  fill="rgba(90,176,230,.20)"/>
  </g>
  <g font-family="'Archivo','Helvetica Neue',Arial,sans-serif" text-anchor="middle" fill="#8fd0f7">
    <text x="150" y="34"  font-size="13" font-weight="600">Agêntico</text>
    <text x="150" y="66"  font-size="12">Automação</text>
    <text x="150" y="98"  font-size="12">Contexto Real</text>
    <text x="150" y="155" font-size="11">Chat simples</text>
  </g>
</svg>
